<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listing</title>
</head>
<body>
    <h2>Ordered List</h2>
  <h5>Data Structure topic</h5>  
  <ol>
    <li>Array</li>
    <li>Linked List</li>
    <li>Stacks</li>
    <li>Queues</li>
    <li>Trees</li>
    <li>Graphs</li>
  </ol>
  <h2>Unordered List</h2>
  <h5>List of available courses</h5>
  <ul>
    <li>Data Structure & Algorithm</li>
    <li>Web Technology</li>
    <li>Aptitude & Logic Reasoning</li>
  </ul>
  <h2>A Description List</h2>
  <dl>
    <dt>Coffee</dt>
    <dd>-500</dd>
    <dt>Milk</dt>
    <dd>-1 ltr Tetra Pack</dd>
  </dl>

</body>
</html>
