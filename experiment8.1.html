<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css list properties</title>
</head>
<style>
    ol {
        background-color: #ff9999;
        padding: 20px;
    }
    ul {
        background-color: #3399ff;
        padding: 20px;
    }
    ol li {
        background-color: #ffe5e5;
        color: darkred;
        padding: 5px;
        margin-left: 35px;
    }
    ul li {
        background-color: #cce5ff;
        color: darkblue;
        margin: 5px;
    }

</style>
<body>
    <h1>Style List With Color</h1>
    <ol>
        <li>Coffee</li>
        <li>Tea</li>
        <li>Coca Cola</li>
    </ol>
    <ul>
        <li>Coffee</li>
        <li>Tea</li>
        <li>Coca Cola</li>
    </ul>
</body>
</html>
