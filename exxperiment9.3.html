<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css image gallery</title>
</head>
<style>
    div.gallery {
        margin: 5px;
        border: 1px solid #ccc;
        float: left;
        width: 180px;
    }
    div.gallery:hover {
        border: 1px solid #777;
    }
    div.gallery img {
        width: 100%;
        height: auto;
    }
    div.desc {
        padding: 15px;
        text-align: center;    
    }
</style>
<body>
   <div class="gallery">
    <a target="_blank" href="cinque terre.jpg">
    <img src="cinque terre.jpg" alt="cinque terre" width="600" height="400">
    </a>
    <div class="desc">add a description of the image here</div>
   </div> 
   <div class="gallery">
   <a target="_blank" href="forest.jpg">
    <img src="forest.jpg" alt="forest" width="600" height="400">
   </a>
   <div class="desc">add a description of the image here</div>
   </div>
   <div class="gallery">
    <a target="_blank" href="northen lights.webp">
        <img src="northen lights.webp" alt="northen lights" width="600" height="400">
    </a>
    <div class="desc">add a description of the image here</div>
   </div>
   <div class="gallery">
   <a target="_blank" href="mountain.jpg">
    <img src="mountain.jpg" alt="mountain" width="600" height="400">
   </a>
   <div class="desc">add a description of the image here</div>
   </div>
   
</body>
</html>
