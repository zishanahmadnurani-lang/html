<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css table property</title>
    <style>
        table, th, td {
            border: 1px solid;
        }
        table {
            width: 100%;
        }
    </style>
</head>
<body>
    <h2>full-width table</h2>
    <table>
        <tr>
            <th>firstname</th>
            <th>lastanme</th>
        </tr>
        <tr>
            <td>peter</td>
            <td>griffin</td>
        </tr>
        <tr>
            <td>lois</td>
            <td>giffin</td>
        </tr>
    </table>
</body>
</html>
